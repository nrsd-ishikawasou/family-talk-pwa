# エラーコード表の正本（基本設計書 第2章 9.2。番号の形と分類は第1章 8.2）。
# params は JSON Schema。meaning は第2章 9.2 の意味の欄の写し（利用者に見せる文言は端末の文言の表が持つ）。log は記録するか、scope: global は全 operation に暗に掛かる番号。
# 番号は欠番を許し、消した番号は retired に移して再利用しない。
rows:
  - code: AUTH-001
    status: 401
    title: "Not authenticated"
    meaning: "未認証"
    retryable: false
    params: {"type": "object", "properties": {}, "additionalProperties": false}
    log: false
    scope: route
    user_text_key: err.AUTH-001
    test: TestErr_AUTH_001
  - code: AUTH-002
    status: 401
    title: "Session revoked"
    meaning: "セッションの失効（理由を params に）"
    retryable: false
    params: {"type": "object", "properties": {"reason": {"type": "string", "enum": ["logout", "device_revoked", "suspended", "deleted", "erased", "key_rotation", "expired"]}}, "additionalProperties": false}
    log: false
    scope: route
    user_text_key: err.AUTH-002
    test: TestErr_AUTH_002
