# 設定の一覧の正本（基本設計書 第11章 7。分類は 7.2、既定値は各章の数値の表）。
# layers は置ける場所（env、file、db、user、room_me、device、guardian。空は固定）。範囲を章が定めない数は min 1（第11章 7.2）。
# 層の優先：環境変数 > ファイル > DB > 既定値（第11章 7.1）。
categories:
  - name: server
    title: サーバー
    chapter: 第11章
  - name: room
    title: トーク
    chapter: 第4章 7
  - name: media
    title: メディア
    chapter: 第5章 9
  - name: retention
    title: 保持
    chapter: 第2章、第12章、第3章
  - name: ratelimit
    title: レート制限
    chapter: 第2章 9.3（ratelimits.yaml）
  - name: push
    title: 通知
    chapter: 第7章 11
  - name: calls
    title: 通話
    chapter: 第6章 8
  - name: auth
    title: 認証
    chapter: 第3章、第1章 DD-1-17
  - name: keys
    title: 鍵
    chapter: 第12章 10
  - name: notices
    title: 知らせ
    chapter: 第7章 9
  - name: backup
    title: バックアップ
    chapter: 第11章 9
  - name: update
    title: 更新
    chapter: 第11章 10
  - name: maps
    title: 地図
    chapter: 第5章 8
  - name: log
    title: ログ
    chapter: 第1章 10.4
  - name: user
    title: 構成員ごと（ft.settings.user/1）
    chapter: 第10章 8、各章
  - name: device
    title: 端末だけ（第10章 8）
    chapter: 第10章 8
  - name: guardian
    title: 保護者が決める子の制限
    chapter: 第3章 9.2
  - name: room_me
    title: トークごとの自分の設定（ft.settings.room_me/1）
    chapter: 第2章 12、第4章
items:
  - key: server.domain
    type: string
    default: null
