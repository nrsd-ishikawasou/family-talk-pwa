        additionalProperties: false
    wsSyncGap:
      name: sync.gap
      title: sync.gap
      summary: 第2章 6.2。向き S→C
      payload:
        type: object
        properties:
          type:
            const: sync.gap
          payload:
            type: object
            properties:
              reason:
                type: string
                enum:
