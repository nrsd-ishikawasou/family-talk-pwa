          id: *id001
        required:
        - type
        - id
        additionalProperties: false
    upPing:
      name: ping
      title: ping
      summary: 第2章 6.4。向き 両方
      payload:
        type: object
        properties:
          type:
            const: ping
        required:
        - type
        additionalProperties: false
    upPong:
      name: pong
      title: pong
      summary: 第2章 6.4。向き 両方
      payload:
        type: object
        properties:
          type:
            const: pong
        required:
        - type
        additionalProperties: false
    pushPayload:
      name: push
      title: ft.push/1
      summary: 第2章 7
      payload:
        $ref: ./schemas/ft.push/1.json
