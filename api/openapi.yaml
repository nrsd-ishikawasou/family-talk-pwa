components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 端末が発行する UUIDv7（第2章 DD-2-5）
      schema:
        $ref: ./schemas/common/uuidv7/1.json
    Limit:
      name: limit
      in: query
      required: false
      description: 件数。範囲の外は NET-001（第2章 3）
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Before:
      name: before
      in: query
      required: false
      description: この要素の直前までの最後の limit 件（第2章 3）
      schema:
        $ref: ./schemas/common/uuidv7/1.json
    After:
      name: after
      in: query
      required: false
      description: この要素の直後から limit 件（第2章 3）
      schema:
        $ref: ./schemas/common/uuidv7/1.json
    Since:
      name: since
      in: query
      required: false
      description: この pos より後。省略は最初から（第2章 3）
      schema:
        $ref: ./schemas/common/pos/1.json
  responses:
    Problem:
      description: RFC 9457 の problem に code、retryable、params（第2章 9.1）
      content:
        application/problem+json:
          schema:
            $ref: ./schemas/problem/1.json
  schemas:
    Family:
      type: object
      properties:
        name: &id001
          type: string
        icon_url: *id001
        admin_names:
