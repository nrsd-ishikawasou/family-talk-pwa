# 境界の正本（OpenAPI 3.1）。中身は基本設計書 第2章 5 と 10。属性の値と規則の名前は第2章 10 の表。
# 直す時は基本設計書の該当の節を先に直し、tools/tests/test_api.py を通す。
openapi: 3.1.0
info:
  title: family-talk
  version: 0.1.0
  description: 家族専用の通信アプリの境界（HTTP の API）。イベントは asyncapi.yaml。中身は基本設計書 第2章 5 と 10。
  contact:
    name: 株式会社流山ソフトウェア開発（NRSD）
    url: https://github.com/nrsd-ishikawasou/family-talk-pwa
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: /api/v1
tags:
- name: setup
  description: 初回の設置（第2章 5.1）
- name: invites
  description: 招待（第2章 5.1）
- name: auth
  description: 認証（第2章 5.2）
- name: me
  description: 本人の資源（第2章 5.2、5.3）
- name: family
  description: 家族（第2章 5.3）
- name: users
  description: 構成員（第2章 5.3）
- name: devices
  description: 端末（第2章 5.4）
- name: keys
  description: 鍵の運搬（第2章 5.4）
- name: rooms
  description: トーク（第2章 5.5）
- name: media
  description: メディア（第2章 5.6）
- name: calls
  description: 通話（第2章 5.7）
- name: push
  description: 通知（第2章 5.8）
- name: shell
  description: Android のシェルの経路（第2章 5.8）
- name: sync
  description: 同期（第2章 5.9）
- name: admin
  description: 管理者（第2章 5.10）
- name: server
  description: サーバー（第2章 5.11）
- name: static
  description: caddy が配る静的な経路（第2章 5.11）
- name: internal
  description: 内部の経路（第2章 10）
paths:
  /setup/status:
    get:
      operationId: getSetupStatus
      tags:
      - setup
      description: 第2章 5.1
      x-authz:
      - none
      x-idempotency: none
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSetupStatusResponse'
        default:
          $ref: '#/components/responses/Problem'
  /setup/admin/{token}:
    parameters:
    - name: token
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getSetupAdmin
      tags:
      - setup
      description: 第2章 5.1
      x-authz:
      - setup_token
      x-idempotency: none
      x-errors:
      - AUTH-007
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSetupAdminResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createSetupAdmin
      tags:
      - setup
      description: 第2章 5.1
      x-authz:
      - setup_token
      x-idempotency: natural
      x-idempotency-natural: token
      x-errors:
      - AUTH-003
      - AUTH-007
      - MEM-005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSetupAdminRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          headers:
            Set-Cookie:
              description: __Host-session（Secure、HttpOnly、SameSite=Lax、Path=/。第2章 4.1）
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /invites:
    get:
      operationId: listInvites
      tags:
      - invites
      description: 第2章 5.1
      x-authz:
      - approved
      x-authz-rule: invite_issue
      x-idempotency: none
      x-errors:
      - MEM-007
      - AUTH-001
      - AUTH-002
      - KEY-004
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Before'
      - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createInvite
      tags:
      - invites
      description: 第2章 5.1
      x-authz:
      - approved
      x-authz-rule: invite_issue
      x-idempotency: key
      x-errors:
      - MEM-004
      - MEM-007
      - AUTH-001
      - AUTH-002
      - KEY-004
      - NET-007
      - NET-008
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInviteResponse'
        default:
          $ref: '#/components/responses/Problem'
  /invites/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: ./schemas/common/uuidv7/1.json
    delete:
      operationId: deleteInvite
      tags:
      - invites
      description: 第2章 5.1
      x-authz:
      - approved
      x-authz-rule: invite_issuer_or_admin
      x-idempotency: none
      x-errors:
      - MEM-001
      - AUTH-001
      - AUTH-002
      - KEY-004
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteInviteResponse'
        default:
          $ref: '#/components/responses/Problem'
  /invite-tokens/{token}:
    parameters:
    - name: token
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getInviteToken
      tags:
      - invites
      description: 第2章 5.1
      x-authz:
      - none
      x-idempotency: none
      x-ratelimit:
      - invite_token
      x-errors:
      - AUTH-007
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInviteTokenResponse'
        default:
          $ref: '#/components/responses/Problem'
  /invite-tokens/{token}/accept:
    parameters:
    - name: token
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: acceptInviteToken
      tags:
      - invites
      description: 第2章 5.1
      x-authz:
      - invite_token
      x-idempotency: natural
      x-idempotency-natural: token
      x-ratelimit:
      - invite_token
      x-errors:
      - AUTH-003
      - AUTH-007
      - MEM-005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteTokenRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          headers:
            Set-Cookie:
              description: __Host-session（Secure、HttpOnly、SameSite=Lax、Path=/。第2章 4.1）
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /auth/passkey/register/options:
    post:
      operationId: createPasskeyRegisterOptions
      tags:
      - auth
      description: 第2章 5.2
      x-authz:
      - approved
      - invite_token
      - setup_token
      - reset_token
      x-reauth: conditional
      x-idempotency: natural
      x-idempotency-natural: challenge
      x-errors:
      - AUTH-007
      - AUTH-001
      - KEY-004
      - AUTH-006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePasskeyRegisterOptionsRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnChallenge'
        default:
          $ref: '#/components/responses/Problem'
  /auth/passkey/register/verify:
    post:
      operationId: verifyPasskeyRegister
      tags:
      - auth
      description: 第2章 5.2
      x-authz:
      - approved
      - invite_token
      x-reauth: conditional
      x-idempotency: natural
      x-idempotency-natural: challenge
      x-errors:
      - AUTH-003
      - KEY-004
      - AUTH-006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPasskeyRegisterRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyPasskeyRegisterResponse'
        default:
          $ref: '#/components/responses/Problem'
  /auth/passkey/login/options:
    post:
      operationId: createPasskeyLoginOptions
      tags:
      - auth
      description: 第2章 5.2
      x-authz:
      - none
      x-idempotency: natural
      x-idempotency-natural: challenge
      x-readonly: allow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePasskeyLoginOptionsRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnChallenge'
        default:
          $ref: '#/components/responses/Problem'
  /auth/passkey/login/verify:
    post:
      operationId: verifyPasskeyLogin
      tags:
      - auth
      description: 第2章 5.2
      x-authz:
      - none
      x-idempotency: natural
      x-idempotency-natural: challenge
      x-ratelimit:
      - login
      x-readonly: allow
      x-errors:
      - AUTH-003
      - AUTH-004
      - MEM-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPasskeyLoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          headers:
            Set-Cookie:
              description: __Host-session（Secure、HttpOnly、SameSite=Lax、Path=/。第2章 4.1）
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /auth/qr/start:
    post:
      operationId: startQrLogin
      tags:
      - auth
      description: 第2章 5.2
      x-authz:
      - none
      x-idempotency: natural
      x-idempotency-natural: repeat_safe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartQrLoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartQrLoginResponse'
        default:
          $ref: '#/components/responses/Problem'
  /auth/qr/poll:
    post:
      operationId: pollQrLogin
      tags:
      - auth
      description: 第2章 5.2
      x-authz:
      - device_code
      x-idempotency: natural
      x-idempotency-natural: device_code
      x-ratelimit:
      - login
      x-errors:
      - AUTH-005
      - AUTH-007
      - AUTH-004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollQrLoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          headers:
            Set-Cookie:
              description: __Host-session（Secure、HttpOnly、SameSite=Lax、Path=/。第2章 4.1）
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /auth/qr/approve:
    post:
      operationId: approveQrLogin
      tags:
      - auth
      description: 第2章 5.2
      x-authz:
      - approved
      x-reauth: true
      x-idempotency: natural
      x-idempotency-natural: user_code
      x-errors:
      - AUTH-005
      - AUTH-006
      - AUTH-007
      - KEY-003
      - MEM-006
      - AUTH-001
      - AUTH-002
      - KEY-004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveQrLoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveQrLoginResponse'
        default:
          $ref: '#/components/responses/Problem'
  /auth/qr/{user_code}:
    parameters:
    - name: user_code
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getQrLogin
      tags:
      - auth
      description: 第2章 5.2
      x-authz:
      - approved
      x-idempotency: none
      x-errors:
      - AUTH-007
      - AUTH-001
      - AUTH-002
      - KEY-004
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetQrLoginResponse'
        default:
          $ref: '#/components/responses/Problem'
  /auth/reset/{token}:
    parameters:
    - name: token
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getPasskeyReset
      tags:
      - auth
      description: 第2章 5.2
      x-authz:
      - reset_token
      x-idempotency: none
      x-errors:
      - AUTH-007
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPasskeyResetResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: resetPasskey
      tags:
      - auth
      description: 第2章 5.2
      x-authz:
      - reset_token
      x-idempotency: natural
      x-idempotency-natural: token
      x-ratelimit:
      - login
      x-errors:
      - AUTH-003
      - AUTH-007
      - AUTH-004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasskeyRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          headers:
            Set-Cookie:
              description: __Host-session（Secure、HttpOnly、SameSite=Lax、Path=/。第2章 4.1）
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /me/passkeys:
    get:
      operationId: listMyPasskeys
      tags:
      - auth
      description: 第2章 5.2
      x-authz:
      - approved
      x-idempotency: none
      x-errors:
      - AUTH-001
      - AUTH-002
      - KEY-004
      parameters:
      - $ref: '#/components/parameters/Limit'
      - name: before
        in: query
        required: false
        description: この要素の直前までの最後の limit 件（第2章 3）
        schema:
          $ref: ./schemas/common/base64url/1.json
      - name: after
        in: query
        required: false
        description: この要素の直後から limit 件（第2章 3）
        schema:
          $ref: ./schemas/common/base64url/1.json
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMyPasskeysResponse'
        default:
          $ref: '#/components/responses/Problem'
  /me/passkeys/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: ./schemas/common/base64url/1.json
    delete:
      operationId: deleteMyPasskey
      tags:
      - auth
      description: 第2章 5.2
      x-authz:
      - approved
      x-reauth: true
      x-idempotency: none
      x-errors:
      - AUTH-006
      - AUTH-008
      - AUTH-001
      - AUTH-002
      - KEY-004
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMyPasskeyResponse'
        default:
          $ref: '#/components/responses/Problem'
  /auth/ws-token:
    post:
      operationId: createWsToken
      tags:
      - auth
      description: 第2章 5.2
      x-authz:
      - session
      x-idempotency: natural
      x-idempotency-natural: repeat_safe
      x-readonly: allow
      x-errors:
      - AUTH-001
      - AUTH-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWsTokenRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenGrant'
        default:
          $ref: '#/components/responses/Problem'
  /auth/shell-token:
    post:
      operationId: createShellToken
      tags:
      - auth
      description: 第2章 5.2
      x-authz:
      - session
      x-idempotency: natural
      x-idempotency-natural: repeat_safe
      x-readonly: allow
      x-errors:
      - AUTH-001
      - AUTH-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShellTokenRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenGrant'
        default:
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      description: 第2章 5.2
      x-authz:
      - session
      x-idempotency: natural
      x-idempotency-natural: repeat_safe
      x-readonly: allow
      x-errors:
      - AUTH-001
      - AUTH-002
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          headers:
            Set-Cookie:
              description: __Host-session を消す（Max-Age=0。第2章 4.1、第3章 4.5）
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /me/session:
    get:
      operationId: getMySession
      tags:
      - me
      description: 第2章 5.2
      x-authz:
      - session
      x-idempotency: none
      x-errors:
      - AUTH-001
      - AUTH-002
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
  /me/disclosure-ack:
    post:
      operationId: ackDisclosure
      tags:
      - me
      description: 第2章 5.2
      x-authz:
      - session
      x-idempotency: natural
      x-idempotency-natural: version
      x-errors:
      - MEM-008
      - AUTH-001
      - AUTH-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckDisclosureRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckDisclosureResponse'
        default:
          $ref: '#/components/responses/Problem'
  /family:
    get:
      operationId: getFamily
      tags:
      - family
      description: 第2章 5.3
      x-authz:
      - none
      x-authz-rule: family_fields
      x-idempotency: none
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Family'
        default:
          $ref: '#/components/responses/Problem'
  /family/disclosure:
    get:
      operationId: getFamilyDisclosure
      tags:
      - family
      description: 第2章 5.3
      x-authz:
      - session
      x-idempotency: none
      x-errors:
      - AUTH-001
      - AUTH-002
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFamilyDisclosureResponse'
        default:
          $ref: '#/components/responses/Problem'
  /family/recovery-cards:
    get:
      operationId: getFamilyRecoveryCards
      tags:
      - family
      description: 第2章 5.3
      x-authz:
      - approved
      x-idempotency: none
      x-errors:
      - AUTH-001
      - AUTH-002
      - KEY-004
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFamilyRecoveryCardsResponse'
        default:
          $ref: '#/components/responses/Problem'
  /me/recovery-cards/{n}:
    parameters:
    - name: n
      in: path
      required: true
      schema:
        type: integer
        enum:
        - 2
        - 3
    post:
      operationId: markRecoveryCardHeld
      tags:
      - me
      description: 第2章 5.3
      x-authz:
      - approved
      x-idempotency: natural
      x-idempotency-natural: n
      x-errors:
      - MEM-009
      - MEM-010
      - MEM-011
      - MEM-002
      - AUTH-001
      - AUTH-002
      - KEY-004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkRecoveryCardHeldRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkRecoveryCardHeldResponse'
        default:
          $ref: '#/components/responses/Problem'
  /me:
    get:
      operationId: getMe
      tags:
      - me
      description: 第2章 5.3
      x-authz:
      - approved
      x-idempotency: none
      x-errors:
      - AUTH-001
      - AUTH-002
      - KEY-004
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMeResponse'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateMe
      tags:
      - me
      description: 第2章 5.3
      x-authz:
      - approved
      x-idempotency: none
      x-errors:
      - MEM-005
      - MEM-007
      - AUTH-001
      - AUTH-002
      - KEY-004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /users:
    get:
      operationId: listUsers
