          items: *id001
        member_count: &id006
          type: integer
          minimum: 0
        created_at: &id003
          $ref: ./schemas/common/rfc3339/1.json
      required:
      - name
      - icon_url
      additionalProperties: false
    User:
      type: object
      properties:
        id: &id002
          $ref: ./schemas/common/uuidv7/1.json
        display_name: *id001
        role: &id005
          type: string
          enum:
          - admin
          - member
        state:
          type: string
          enum:
          - normal
          - suspended
          - erase_pending
          - deleted
          - erased
        child: &id004
          type: boolean
        user_sig_pub:
          $ref: ./schemas/fusr/1.json
      required:
      - id
      - display_name
      - role
      - state
      additionalProperties: false
    UserDetail:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
