# 変更ごとの CI（基本設計書 第14章 11.1、11.4。全体実装設計書 6.1）。
# アクションは全てコミットの SHA で固定する（版は注記）。web、android の job は、そのディレクトリを作る WP で足す。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    name: 境界（L2）
    # L2 境界：api/ の検証と基本設計書との照合（T-L2-01、T-L2-07、T-L2-08）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Python の依存（ハッシュで照合）
        run: python -m pip install --require-hashes --no-deps -r tools/requirements.txt
      - name: 道具と境界の試験
        run: python -m unittest discover -s tools/tests -t .
      - name: 設定の一覧と各章の数値の表（T-L2-07）
        run: python -m tools.config_check
      - name: 要件の注記と試験設計書 第2章の表
        run: python -m tools.trace_requirements
      - name: エラーの文言の表と第10章 9.2 の表（差分 0）
        run: python -m tools.gen_texts --check
      - name: エラーコード表と L1 の試験の名と文言の表（T-L2-05。試験を求める番号は作り終えたブロックの分）
        run: python -m tools.errors_check --tests NET,SRV-001,SRV-003,SRV-004 --texts web/src/i18n/ja/errors.json
      - name: 生成してコミットする形の再現（第14章 8）
        run: python -m tools.gen_config --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Node の道具（ロックファイルの完全性のハッシュで照合）
        working-directory: tools/node
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: AsyncAPI CLI の利用の統計を止める
        run: tools/node/node_modules/.bin/asyncapi config analytics --disable
      - name: Spectral（T-L2-01）
        run: tools/node/node_modules/.bin/spectral lint api/openapi.yaml api/asyncapi.yaml --ruleset api/.spectral.yaml --fail-severity hint
      - name: AsyncAPI の検証（T-L2-01）
        run: tools/node/node_modules/.bin/asyncapi validate api/asyncapi.yaml

  server:
    name: サーバー（L0）
    # サーバー側の検査と単体の試験（第14章 11.1 の server/ の列、9.2、9.3）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Python の依存（生成の道具）
        run: python -m pip install --require-hashes --no-deps -r tools/requirements.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: server/go.sum
      - name: 生成と生成の再現性（第14章 8）
        run: |
          make gen PYTHON=python GOFMT=gofmt
          make gen-check PYTHON=python GOFMT=gofmt
      - name: gofmt
        working-directory: server
        run: test -z "$(gofmt -l .)"
      - name: go vet
        working-directory: server
        run: |
          go vet ./...
          go vet -tags integration ./...
      - name: staticcheck（生成の package を除く。結合の試験も見る）
        working-directory: server
        run: |
          pkgs=$(go list ./... | grep -v '/internal/boundary/gen$')
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 $pkgs
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags integration $pkgs
      - name: 自前の検査（ftlint）
        working-directory: server
        run: go run ./cmd/ftlint ./...
      - name: 単体の試験（race の検出つき）
        working-directory: server
        run: go test -race -count=1 ./...
      - name: 結合の試験（L1。testcontainers の postgres 18）
        working-directory: server
        run: go test -race -count=1 -tags integration ./...
      - name: 平文の走査の骨（T-L1-16。走査する置き場は L1 の試験が本文を書くブロックから足す）
        run: |
          python -m tools.no_plaintext --generate 32 --markers "$RUNNER_TEMP/plaintext_markers.txt"
          python -m tools.no_plaintext --markers "$RUNNER_TEMP/plaintext_markers.txt"
      - name: 脆弱性（govulncheck）
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: ライセンスの許可リスト（第14章 9.1。9.3 の部品と本システム自身を除く）
        working-directory: server
        run: >-
          go run github.com/google/go-licenses/v2@v2.0.1 check ./...
          --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,Zlib,PostgreSQL,BSL-1.0,Unlicense,CC0-1.0,0BSD,MPL-2.0
          --ignore github.com/nrsd-ishikawasou/family-talk-pwa/server
          --ignore github.com/in-toto/in-toto-golang
          --ignore github.com/in-toto/attestation
          --ignore github.com/cyberphone/json-canonicalization

  docs:
    name: 文書
    # 文書の検査（第14章 11.1 の api/ と docs/ の列、第14章 14）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Node の道具
        working-directory: tools/node
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Python の依存（reuse を含む）
        run: python -m pip install --require-hashes --no-deps -r tools/requirements.txt
      - name: REUSE 3.3（第14章 9.2）
        run: reuse lint
      - name: markdownlint
        run: tools/node/node_modules/.bin/markdownlint-cli2
      - name: textlint（日本語の技術文書の規則）
        working-directory: tools/node
        run: ./node_modules/.bin/textlint "../../README.md" "../../CHANGELOG.md" "../../SECURITY.md" "../../docs/**/*.md" "../../dev/docs/**/*.md" "../../api/**/*.md"
      - name: リンクと見出しの位置（リポジトリの中だけ）
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # node_modules は npm ci で入る他人の部品。glob を渡すと .gitignore が当たらないため明示で除く
          args: --offline --include-fragments --no-progress --exclude-path "node_modules" "./**/*.md"
          fail: true

  forbidden_words:
    name: 禁止語
    # 他社の名称と痕跡（第14章 14 の 1）。一覧は environment の secret。fork の PR では secret が無いので飛ばし、main への merge の前の run で必ず走る
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: forbidden-words
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: 禁止語の走査
        env:
          FORBIDDEN_WORDS: ${{ secrets.FORBIDDEN_WORDS }}
        run: |
          if [ -z "${FORBIDDEN_WORDS}" ]; then
            echo "一覧が無いので飛ばす（fork の PR）"
            exit 0
          fi
          printf '%s\n' "${FORBIDDEN_WORDS}" > tools/forbidden_words.txt
          python -m tools.forbidden_words

  workflows:
    name: ワークフロー
    # ワークフローの検査（第14章 11.1、11.4）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Python の依存（zizmor を含む）
        run: python -m pip install --require-hashes --no-deps -r tools/requirements.txt
      - name: zizmor
        run: zizmor --persona=auditor .github/workflows
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - name: actionlint（Go のモジュールのチェックサムで照合）
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
